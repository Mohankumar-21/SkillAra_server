openapi: 3.0.3
info:
  title: SkillAra Tenant API
  version: 1.0.0
  description: API for managing tenants in SkillAra multi-tenant application
servers:
  - url: http://localhost:5000/api
    description: Local server

components:
  schemas:
    Tenant:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB generated unique ID
        tenant_name:
          type: string
          example: ABC University
        domain:
          type: string
          example: abcuni.com
        sub_domain:
          type: string
          example: abc
        email:
          type: string
          example: admin@abcuni.com
        status:
          type: boolean
          example: true
        logo:
          type: object
          properties:
            status:
              type: boolean
            mime_type:
              type: string
            image_name:
              type: string
            image_blob:
              type: string
        user_count:
          type: integer
          example: 0
        created_by:
          type: string
          example: admin
        updated_by:
          type: string
          example: admin
        created_on:
          type: string
          format: date-time
        updated_on:
          type: string
          format: date-time

paths:
   /tenants:
    post:
      summary: Create a new tenant
      tags:
        - Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Tenant created successfully
                  data:
                    $ref: '#/components/schemas/Tenant'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Tenant creation failed

    get:
      summary: Get all tenants
      tags:
        - Tenant
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Tenants fetched successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
